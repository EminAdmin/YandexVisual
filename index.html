<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Яндекс Музыка — Космическая Орбита</title>
    <style>
        :root {
            --ym-bg: #07070a;
            --ym-card: rgba(18, 18, 24, 0.68);
            --ym-surface: rgba(255, 255, 255, 0.06);
            --ym-surface-hover: rgba(255, 255, 255, 0.12);
            --ym-yellow: #ffcc00;
            --ym-yellow-hover: #ffe033;
            --ym-text: #ffffff;
            --ym-text-muted: #8e8e9c;
            --ym-border: rgba(255, 255, 255, 0.08);
            --ym-border-glow: rgba(255, 204, 0, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--ym-bg);
            color: var(--ym-text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ym-header {
            z-index: 2;
            margin-top: 24px;
            padding: 9px 20px;
            background: var(--ym-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--ym-border);
            border-radius: 99px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(255, 204, 0, 0.05);
        }

        .ym-wave-icon {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--ym-yellow);
            box-shadow: 0 0 12px var(--ym-yellow), 0 0 24px var(--ym-yellow);
            animation: cosmicPulse 2.5s infinite ease-in-out;
        }

        @keyframes cosmicPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.4); opacity: 1; box-shadow: 0 0 18px var(--ym-yellow); }
        }

        .ym-header span {
            color: var(--ym-text-muted);
            font-weight: 500;
        }

        .ym-header strong {
            color: var(--ym-text);
            font-weight: 600;
        }

        .ym-player-card {
            z-index: 2;
            margin-bottom: 32px;
            padding: 24px 26px;
            background: var(--ym-card);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--ym-border);
            border-radius: 32px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 92%;
            max-width: 420px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 204, 0, 0.03);
            transition: border-color 0.3s ease;
        }

        .ym-player-card:hover {
            border-color: var(--ym-border-glow);
        }

        .ym-track-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .ym-track-meta {
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow: hidden;
        }

        .ym-title {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--ym-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ym-artist {
            font-size: 14px;
            color: var(--ym-text-muted);
            font-weight: 500;
        }

        .ym-upload-btn {
            padding: 9px 16px;
            border-radius: 14px;
            background: var(--ym-surface);
            color: var(--ym-text);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            border: 1px solid var(--ym-border);
        }

        .ym-upload-btn:hover {
            background: var(--ym-surface-hover);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .ym-progress-wrap {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ym-progress-bar {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: height 0.2s;
        }

        .ym-progress-bar:hover {
            height: 7px;
        }

        .ym-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff9900, var(--ym-yellow));
            border-radius: 6px;
            box-shadow: 0 0 10px var(--ym-yellow);
            transition: width 0.1s linear;
        }

        .ym-time-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--ym-text-muted);
            font-variant-numeric: tabular-nums;
        }

        .ym-controls {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ym-play-btn {
            width: 100%;
            height: 50px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #ffdb4d 0%, var(--ym-yellow) 100%);
            color: #07070a;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 25px rgba(255, 204, 0, 0.25);
            transition: all 0.2s ease;
        }

        .ym-play-btn:hover {
            background: linear-gradient(135deg, #ffe680 0%, var(--ym-yellow-hover) 100%);
            box-shadow: 0 10px 30px rgba(255, 204, 0, 0.4);
            transform: translateY(-1px);
        }

        .ym-play-btn:active {
            transform: scale(0.97);
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <div class="ym-header">
        <div class="ym-wave-icon"></div>
        <span>Мастерская • <strong>xXdevXx</strong></span>
    </div>

    <canvas id="visualizer"></canvas>

    <div class="ym-player-card">
        <div class="ym-track-header">
            <div class="ym-track-meta">
                <div class="ym-title" id="trackName">Название трека</div>
                <div class="ym-artist">Автор трека</div>
            </div>
            <label class="ym-upload-btn" for="audioFile">Выбрать MP3</label>
            <input type="file" id="audioFile" accept="audio/*">
        </div>

        <div class="ym-progress-wrap">
            <div class="ym-progress-bar" id="progressBar">
                <div class="ym-progress-fill" id="progressFill"></div>
            </div>
            <div class="ym-time-row">
                <span id="currentTime">0:00</span>
                <span id="durationTime">0:00</span>
            </div>
        </div>

        <div class="ym-controls">
            <button class="ym-play-btn" id="playPauseBtn">▶ Запустить волну</button>
        </div>
    </div>

    <audio id="audio" crossorigin="anonymous"></audio>

    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const audio = document.getElementById('audio');
        const fileInput = document.getElementById('audioFile');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const trackNameEl = document.getElementById('trackName');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');

        let audioCtx, analyser, source, dataArray;
        let isInitialized = false;

        let stars = [];
        let cosmicDust = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        for (let i = 0; i < 90; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.8,
                alpha: Math.random() * 0.7 + 0.2
            });
        }

        for (let i = 0; i < 60; i++) {
            cosmicDust.push({
                angle: Math.random() * Math.PI * 2,
                dist: 100 + Math.random() * 200,
                speed: 0.3 + Math.random() * 0.8,
                size: 1 + Math.random() * 2,
                alpha: 0.2 + Math.random() * 0.6
            });
        }

        function formatTime(sec) {
            if (isNaN(sec)) return '0:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const pct = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = pct + '%';
                currentTimeEl.textContent = formatTime(audio.currentTime);
                durationTimeEl.textContent = formatTime(audio.duration);
            }
        });

        progressBar.addEventListener('click', (e) => {
            if (!audio.duration) return;
            const rect = progressBar.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            audio.currentTime = pos * audio.duration;
        });

        function initAudio() {
            if (isInitialized) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            analyser.smoothingTimeConstant = 0.8;

            source = audioCtx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);

            dataArray = new Uint8Array(analyser.frequencyBinCount);
            isInitialized = true;
        }

        fileInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                audio.src = url;
                trackNameEl.textContent = file.name.replace(/\.[^/.]+$/, "");
                initAudio();
                audio.play();
                playPauseBtn.textContent = '⏸ Пауза';
            }
        });

        playPauseBtn.addEventListener('click', () => {
            if (!audio.src) {
                fileInput.click();
                return;
            }
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (audio.paused) {
                audio.play();
                playPauseBtn.textContent = '⏸ Пауза';
            } else {
                audio.pause();
                playPauseBtn.textContent = '▶ Запустить волну';
            }
        });

        function render() {
            requestAnimationFrame(render);

            ctx.fillStyle = 'rgba(7, 7, 10, 0.32)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(s => {
                s.alpha += (Math.random() - 0.5) * 0.03;
                if (s.alpha < 0.1) s.alpha = 0.1;
                if (s.alpha > 0.9) s.alpha = 0.9;

                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
                ctx.fill();
            });

            const cx = canvas.width / 2;
            const cy = canvas.height / 2 - 50;

            let bass = 0;
            if (isInitialized && !audio.paused) {
                analyser.getByteFrequencyData(dataArray);
                for (let i = 0; i < 10; i++) bass += dataArray[i];
                bass /= 10;
            } else {
                const t = Date.now() * 0.002;
                bass = Math.sin(t) * 20 + 25;
                if (!dataArray) dataArray = new Uint8Array(128);
                for (let i = 0; i < 128; i++) {
                    dataArray[i] = Math.sin(t + i * 0.2) * 15 + 20;
                }
            }

            const nebula = ctx.createRadialGradient(cx, cy, 20, cx, cy, 320 + bass * 1.5);
            nebula.addColorStop(0, 'rgba(255, 204, 0, ' + (0.15 + (bass / 255) * 0.2) + ')');
            nebula.addColorStop(0.4, 'rgba(120, 40, 200, 0.06)');
            nebula.addColorStop(1, 'rgba(7, 7, 10, 0)');
            ctx.fillStyle = nebula;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            cosmicDust.forEach(p => {
                p.angle += 0.002 + (bass / 255) * 0.012;
                const dist = p.dist + (bass / 255) * 60;
                const px = cx + Math.cos(p.angle) * dist;
                const py = cy + Math.sin(p.angle) * dist;

                ctx.beginPath();
                ctx.arc(px, py, p.size + (bass / 255), 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 220, 50, ' + p.alpha + ')';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ffcc00';
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            const baseRadius = Math.min(canvas.width, canvas.height) * 0.15;

            ctx.save();
            ctx.translate(cx, cy);

            const coreR = baseRadius * 0.85 + (bass / 255) * 30;
            ctx.beginPath();
            ctx.arc(0, 0, coreR, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 204, 0, 0.08)';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(255, 204, 0, 0.5)';
            ctx.stroke();

            if (audio.duration && !audio.paused) {
                const progressAngle = (audio.currentTime / audio.duration) * Math.PI * 2 - Math.PI / 2;
                ctx.beginPath();
                ctx.arc(0, 0, coreR + 6, -Math.PI / 2, progressAngle);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ffffff';
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            const bars = 160;
            for (let i = 0; i < bars; i++) {
                const angle = (i / bars) * Math.PI * 2 - Math.PI / 2;
                const freqVal = dataArray[i % dataArray.length] || 0;

                const innerR = coreR + 12;
                const len = (freqVal / 255) * 95 + 4;
                const outerR = innerR + len;

                const x1 = Math.cos(angle) * innerR;
                const y1 = Math.sin(angle) * innerR;
                const x2 = Math.cos(angle) * outerR;
                const y2 = Math.sin(angle) * outerR;

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = freqVal > 180 ? '#ffffff' : '#ffcc00';
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.shadowBlur = freqVal > 150 ? 15 : 0;
                ctx.shadowColor = '#ffcc00';
                ctx.stroke();
            }
            ctx.restore();
        }

        render();
    </script>
</body>
</html>
